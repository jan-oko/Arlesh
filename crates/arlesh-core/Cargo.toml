[package]
name = "arlesh-core"
version = "0.3.0"
description = "Arlesh's domain: the model, its rules, the session layer, undo and the MCP endpoint"
edition = "2021"

# Nothing here may depend on `tauri`, directly or through another crate: the core is what every
# host — the desktop app, the Python bindings — builds on, and a Python build must not compile a
# webview. CI asserts it with `cargo tree` (see .github/workflows/ci.yml).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt", "sync"] }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
axum = "0.8.9"
schemars = { version = "1.2.2", features = ["chrono04"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
