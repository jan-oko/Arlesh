[package]
name = "arlesh-py"
version = "0.3.0"
description = "Python bindings for arlesh-core"
edition = "2021"
publish = false

# The extension module Python imports as `arlesh._native`. maturin builds it (pyproject.toml);
# `cargo build` alone produces a library Python cannot load, because the module links against the
# interpreter that imports it rather than any one libpython.
[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arlesh-core = { path = "../arlesh-core" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.2", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
