[package]
name = "arlesh-rules-wasm"
version = "0.3.0"
description = "arlesh-rules compiled to wasm32 for the frontend's optimistic lane"
edition = "2021"
publish = false

# The wasm boundary: a thin wasm-bindgen layer over `arlesh-rules`. JS values cross it through
# serde-wasm-bindgen, and the TypeScript declarations are generated by tsify, so the frontend calls
# a rule with no `any` and no `as`. Built by `scripts/build-rules-wasm.sh` (never by `cargo build`
# for the host: there it compiles but is inert).
# Its own workspace and lockfile, deliberately: the app's lockfile pins wasm-bindgen to whatever
# reqwest's wasm shims want, and this crate must pin the version of the `wasm-bindgen-cli` that CI
# installs. It also keeps `cargo test --workspace` and the app's release profile out of it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arlesh-rules = { path = "../arlesh-rules" }
serde = { version = "1", features = ["derive"] }
# Pinned to the wasm-bindgen-cli version the build script and CI install; they must match exactly.
wasm-bindgen = "=0.2.130"
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }

# Size-first: the module ships inside the app bundle and the Android APK.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
