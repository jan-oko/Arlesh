name: pnn check (temporary)

# A development aid for Arlesh-pnn only, removed before the PR is ready: every compile error in
# every target at once (`--keep-going`), where the CI gate stops at the first failing test binary.
on:
  push:
    branches: [arlesh-pnn-virtual-nodes]

concurrency:
  group: pnn-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-llvm-cov-manual
          save-if: false
      - name: Stub the frontend bundle
        run: |
          mkdir -p dist
          printf '<!doctype html><title>arlesh ci</title>' > dist/index.html
      - name: cargo clippy --keep-going
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --keep-going --message-format short -- -D warnings
      - name: cargo test --no-fail-fast
        if: always()
        working-directory: src-tauri
        run: set -o pipefail; cargo test --locked --no-fail-fast 2>&1 | grep -v "^test .* ok$"
        shell: bash {0}
