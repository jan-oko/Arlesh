name: Bundles

# Installable builds published to GitHub Releases: for Linux an AppImage and a
# tarball of the bare release binary (no .deb or .rpm, by choice), and for
# Windows the NSIS setup .exe and the .msi.
#
#   push to master   rolling pre-release, tag `latest`: the tag is moved to the
#                    pushed commit and the assets replaced, so
#                    https://github.com/jan-oko/Arlesh/releases/tag/latest is
#                    always the newest master build, and its asset names carry
#                    no version or sha, so direct download links keep working.
#   push tag vX.Y.Z  a normal release for that tag, with versioned asset names.
#                    The tag must equal tauri.conf.json's version, or the run
#                    fails before building.
#   dispatch         rolling, to the tag named by the `release_tag` input. It
#                    exists for testing on a throwaway tag; `latest` itself is
#                    only ever written from master. With `publish` off it builds
#                    and keeps the workflow artifacts but touches no release —
#                    how a branch tries a change to the build itself.
#
# This is not a gate and never runs on pull requests: a release build compiles
# the whole tree a second way (optimised, uninstrumented), and paying that on
# every PR would roughly double PR wall time for something only master needs.
# Being its own workflow on its own triggers, it cannot become a required check.
#
# Write access is as narrow as it can be: `build` and `build-windows` run npm
# ci, build scripts and the compiler with a read-only token and hand their
# output over as workflow artifacts (kept 30 days, which also gives every master
# commit its own downloadable build); `release` holds contents: write and runs
# nothing but gh. `meta` reads the version once, for all three.
#
# Nothing is signed; there are no secrets beyond the default GITHUB_TOKEN. On
# Windows that means SmartScreen warns on first run ("Windows protected your
# PC" → More info → Run anyway); signing is a separate piece of work.
#
# It builds on ubuntu-22.04 deliberately. A Linux binary links against the glibc
# of the machine that built it and runs on that version or newer, not older.
# Building on the oldest runner that still ships webkit2gtk-4.1 is what lets the
# same binary run on 24.04, Fedora and Arch alike; ubuntu-latest would quietly
# raise that floor every time the image moves.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rolling pre-release tag to publish to (`latest` only from master)
        default: latest
        required: true
      publish:
        description: Publish to the release (off builds the artifacts only)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # First, so a mistyped tag fails in seconds rather than after either build.
  meta:
    name: version · sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version and short sha
        id: meta
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json's version $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: tauri build · linux bundles
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Same set as ci.yml's rust lane — webkit2gtk-4.1 exists on 22.04 too.
      # `file` is what linuxdeploy (the AppImage bundler) uses to classify ELF
      # files; it is on the image today, named here so it stays that way.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # /rust-toolchain.toml resolves here exactly as in ci.yml; printing it is
      # the proof in the log that the pin did.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # Its own key: a release build on 22.04 shares no artifacts with the
      # instrumented debug build ci.yml caches on ubuntu-latest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-bundles-ubuntu-22.04

      # beforeBuildCommand (npm run build) produces dist/ first, so this is the
      # real frontend, not ci.yml's stub.
      #
      # NO_STRIP: linuxdeploy ships an old `strip` that fails on libraries
      # carrying newer ELF sections (.relr.dyn), aborting the AppImage step.
      # Skipping the strip costs some size and nothing else.
      - name: tauri build
        env:
          NO_STRIP: 'true'
        run: npx tauri build --ci --bundles appimage

      # Stable names, with no version or sha in them: these are the names the
      # rolling release serves, so a download link to one never goes stale.
      # The release job adds the version for a tagged release.
      - name: Stage bundles under stable names
        run: |
          out="$RUNNER_TEMP/bundles"
          mkdir -p "$out"
          bundle=src-tauri/target/release/bundle
          cp $bundle/appimage/*.AppImage "$out/Arlesh-linux-x86_64.AppImage"
          tar -czf "$out/arlesh-linux-x86_64.tar.gz" -C src-tauri/target/release arlesh
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: arlesh-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.sha }}-linux-appimage
          path: ${{ runner.temp }}/bundles/*.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: arlesh-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.sha }}-linux-x86_64-tarball
          path: ${{ runner.temp }}/bundles/*.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # The Windows installers. `tauri build` makes both from tauri.conf.json's
  # bundle settings: the NSIS setup .exe (per-user, into %LOCALAPPDATA%, no
  # admin prompt) and the .msi (per-machine, for anyone who deploys with
  # msiexec). Both bootstrap WebView2 if it is missing, which on Windows 10 and
  # 11 it almost never is. Nothing is signed.
  build-windows:
    name: tauri build · windows installers
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # /rust-toolchain.toml resolves here as on Linux; rustup installs the
      # pinned toolchain on first use, and this prints the proof.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-bundles-windows

      # Tauri fetches NSIS and WiX itself on first use.
      - name: tauri build
        run: npx tauri build --ci --bundles nsis,msi

      # The same stable-name rule as the Linux assets: no version or sha, so a
      # download link to the rolling release never goes stale.
      - name: Stage installers under stable names
        run: |
          out="$RUNNER_TEMP/bundles"
          mkdir -p "$out"
          bundle=src-tauri/target/release/bundle
          cp $bundle/nsis/*-setup.exe "$out/Arlesh-windows-x86_64-setup.exe"
          cp $bundle/msi/*.msi "$out/Arlesh-windows-x86_64.msi"
          ls -la "$out"

      # Installs the setup .exe silently, launches what it installed and
      # requires it to be alive, with its MCP endpoint answering on 127.0.0.1,
      # 30 seconds later. A crash on start — a Linux-only path, a missing
      # resource, a panic in setup — fails here rather than on someone's desk.
      # What it cannot see: the runner has no one at the screen, so the tray,
      # the windows and tab dragging are checked by hand (see README).
      - name: Smoke test · install, start, MCP answers
        shell: pwsh
        env:
          RUST_LOG: info
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'bundles\Arlesh-windows-x86_64-setup.exe'
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Arlesh'
          Get-ChildItem $dir
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "the installer put no app executable in $dir" }

          $log = Join-Path $env:RUNNER_TEMP 'arlesh-out.log'
          $err = Join-Path $env:RUNNER_TEMP 'arlesh-err.log'
          $app = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $log -RedirectStandardError $err

          $answered = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if ($app.HasExited) { break }
            $client = New-Object System.Net.Sockets.TcpClient
            try { $client.Connect('127.0.0.1', 4747); $answered = $true } catch { } finally { $client.Dispose() }
          }
          $alive = -not $app.HasExited

          Write-Host '--- stdout'; Get-Content $log -ErrorAction SilentlyContinue
          Write-Host '--- stderr'; Get-Content $err -ErrorAction SilentlyContinue
          Write-Host "--- app data"; Get-ChildItem (Join-Path $env:APPDATA 'com.atai.arlesh') -ErrorAction SilentlyContinue

          if ($alive) { Stop-Process -Id $app.Id -Force }
          if (-not $alive) { throw "Arlesh exited on start (exit code $($app.ExitCode))" }
          if (-not $answered) { throw 'Arlesh started but its MCP endpoint never answered on 127.0.0.1:4747' }
          Write-Host 'Arlesh started, stayed up, and its MCP endpoint answered.'

      - uses: actions/upload-artifact@v4
        with:
          name: arlesh-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.sha }}-windows-setup
          path: ${{ runner.temp }}/bundles/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: arlesh-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.sha }}-windows-msi
          path: ${{ runner.temp }}/bundles/*.msi
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: publish · github release
    needs: [meta, build, build-windows]
    # A dispatch with `publish` off stops at the artifacts.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'latest' }}
      VERSION: ${{ needs.meta.outputs.version }}
      SHORT_SHA: ${{ needs.meta.outputs.sha }}
    # One publisher per release at a time, so two master pushes never race on
    # `latest`. A queued run that is superseded by a newer one is cancelled,
    # which is fine: the newer one publishes the newer commit.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: arlesh-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.sha }}-*
          path: bundles
          merge-multiple: true

      - name: Publish
        run: |
          set -euo pipefail
          cd bundles

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Arlesh-linux-x86_64.AppImage -> Arlesh-0.3.0-linux-x86_64.AppImage,
            # and the same for the Windows installers.
            for f in *; do mv "$f" "$(sed -E "s/-(linux|windows)-/-$VERSION-\1-/" <<<"$f")"; done
            ls -la
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --verify-tag \
                --title "Arlesh $VERSION" \
                --notes "Arlesh $VERSION, built from $SHORT_SHA."
            fi
            gh release upload "$TAG" --clobber *
            exit 0
          fi

          # Rolling. `latest` is master's alone: a dispatch from any other ref
          # has to name a different tag.
          if [ "$TAG" = latest ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::The latest release is only published from master; pass another release_tag."
            exit 1
          fi

          # Builds run in parallel and can finish out of order. If the branch
          # has moved on since this commit, a newer run publishes it; stepping
          # aside here keeps an older build from overwriting a newer one.
          head=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME is at $head now, not $GITHUB_SHA; leaving $TAG to the newer run."
            exit 0
          fi

          ls -la

          # Point the tag at this commit, creating it the first time.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

          title="Latest $GITHUB_REF_NAME build"
          notes=$(printf '%s\n\n%s\n' \
            "Arlesh $VERSION, built from [\`$SHORT_SHA\`]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA) on $(date -u +'%Y-%m-%d %H:%M UTC')." \
            "Rebuilt on every push to $GITHUB_REF_NAME; the assets are replaced in place, so their download links stay the same.")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --verify-tag --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          gh release upload "$TAG" --clobber *
