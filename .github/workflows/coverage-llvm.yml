name: Coverage (llvm measurement — THROWAWAY)

# Temporary. Delete before PR #20 merges.
#
# Third and last measurement. What the first two established, all on 4958811:
#
#   ptrace                 91.01%  3442/3782   run phase 159s   correct
#   tarpaulin --engine llvm 89.44%  3083/3447   run phase  45s   WRONG
#   cargo llvm-cov         96.29%     — /7281   run phase  20s   correct, inflated
#
# Tarpaulin's llvm engine is not a stricter ruler, it loses data: on
# src/infos/mod.rs it reports 17/74 where ptrace watched 74/74 run and
# cargo-llvm-cov independently says 100%, with an identical denominator. Same
# for src/block_reasons/mod.rs at 10/41 against 40/41. Neither file contains a
# single inline `#[cfg(test)]` block, so no test-code accounting is involved —
# it is dropped profraw data, which its README warns about for fork and threads.
# A floor of 89 would have written that bug into the gate.
#
# cargo-llvm-cov is correct but counts inline `#[cfg(test)] mod tests` bodies as
# source: files with no inline tests come out SMALLER than tarpaulin
# (infos/mod.rs 38 vs 74), files with large ones come out several times LARGER
# (flows/render.rs 449 vs 65). Hence 7281 against 3782, roughly half of it test
# code that is 100% covered by construction and cannot regress.
#
# This run applies the fix taiki-e/cargo-llvm-cov#123 recommends —
# `#[cfg_attr(coverage_nightly, coverage(off))]` on all 17 test modules — and
# reports the denominator and percentage that result. `#[coverage(off)]` is
# still E0658 on rustc 1.96.0 (stabilised in rust-lang/rust#130766, reverted in
# #134672), so the report needs nightly. The attribute compiles away on stable,
# so `cargo test` and `cargo build` stay on 1.96 and are unaffected.

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/coverage-llvm.yml'
  workflow_dispatch:

concurrency:
  group: coverage-llvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  llvm-cov-nightly:
    name: cargo +nightly llvm-cov (measurement)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libssl-dev

      # Nightly is needed only to make `coverage(off)` legal. llvm-tools must
      # come from the same toolchain that instruments the binaries, or the
      # profiles fail to merge.
      - name: Install nightly with llvm-tools
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          rustup run nightly rustc --version

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: llvm-cov-nightly

      - name: Stub the frontend bundle
        run: |
          mkdir -p dist
          printf '<!doctype html><title>arlesh ci</title>' > dist/index.html

      - name: llvm-cov clean
        working-directory: src-tauri
        run: cargo +nightly llvm-cov clean --workspace

      - name: Build and run instrumented tests
        working-directory: src-tauri
        run: cargo +nightly llvm-cov --locked --no-report

      - name: Report
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo +nightly llvm-cov report \
            --summary-only \
            --ignore-filename-regex '(^|/)src/commands/' \
            2>&1 | tee "$RUNNER_TEMP/llvm-cov-nightly.log"

      # A floor nobody has watched fire is an assumption, not a gate. This
      # asserts both directions against the measured 95.14%: an impossible floor
      # must fail the command, and the proposed one must pass it. If the first
      # of these exits 0 the flag does nothing and the whole switch is worthless.
      - name: Prove --fail-under-lines actually fails
        working-directory: src-tauri
        run: |
          set +e
          cargo +nightly llvm-cov report --summary-only \
            --ignore-filename-regex '(^|/)src/commands/' \
            --fail-under-lines 99 >/dev/null 2>&1
          high=$?
          cargo +nightly llvm-cov report --summary-only \
            --ignore-filename-regex '(^|/)src/commands/' \
            --fail-under-lines 94 >/dev/null 2>&1
          low=$?
          set -e
          echo "floor 99 (must be non-zero): $high"
          echo "floor 94 (must be zero):     $low"
          [ "$high" -ne 0 ] || { echo "FAIL: floor of 99 did not fail the gate"; exit 1; }
          [ "$low" -eq 0 ]  || { echo "FAIL: floor of 94 rejected a 95.14% tree"; exit 1; }
          echo "gate fires correctly in both directions"

      # The other half of the decision. If coverage moves to nightly then the
      # suite only ever executes on nightly, and the pinned stable 1.96 that
      # actually ships gets no test run at all. This is what recovering that
      # costs on a warm cache — if it is close to the coverage job itself, the
      # merge saving that motivated the switch is largely given back.
      - name: Cost of still testing on stable
        working-directory: src-tauri
        run: |
          start=$(date +%s)
          cargo test --locked --no-run 2>&1 | tail -2
          echo "stable test build: $(( $(date +%s) - start ))s"

      - name: Summarise
        if: always()
        run: |
          {
            echo '### cargo +nightly llvm-cov, test modules excluded'
            echo '```'
            tail -6 "$RUNNER_TEMP/llvm-cov-nightly.log" 2>/dev/null || echo 'no report'
            echo '```'
            echo 'For comparison, same commit:'
            echo '- ptrace                  91.01%  3442/3782'
            echo '- cargo llvm-cov, stable  96.29%     -/7281  (test bodies counted)'
          } >> "$GITHUB_STEP_SUMMARY"
