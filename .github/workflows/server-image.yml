name: Server image

# The arlesh-server container image, ghcr.io/jan-oko/arlesh-server, built from
# docker/server.Dockerfile for linux/amd64 and linux/arm64.
#
#   pull request to dev or master   build only, amd64 only, nothing pushed: proves the Dockerfile
#                                   builds. Runs only when something the image is built from
#                                   changed (the paths below), because the repo is private and
#                                   every minute is billed.
#   push to master                  the release merge: both platforms, pushed as `latest`,
#                                   the version (tauri.conf.json's, as bundles.yml reads it) and
#                                   the short sha.
#   push tag vX.Y.Z                 the same, for the tag; it must equal that version.
#   dispatch                        build only, both platforms unless `amd64_only`; nothing pushed
#                                   (the push happens from master or a tag, never from a branch).
#
# The arm64 image is not built under QEMU: the Dockerfile cross-compiles the wheel on the build
# platform (maturin + zig). Only the runtime stage, a pip install of prebuilt wheels, runs
# emulated. The image build does not wait for bundles.yml; both run on the same push.
#
# `packages: write` is on the one job that pushes, and nowhere else.

on:
  pull_request:
    branches: [dev, master]
    paths:
      - docker/**
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - src-tauri/Cargo.toml
      - .github/workflows/server-image.yml
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      amd64_only:
        description: Build for linux/amd64 only
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jan-oko/arlesh-server

jobs:
  image:
    name: server image · build${{ (github.event_name == 'push') && ' · push' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: server-image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version, sha and tags
        id: meta
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json's version $version (expected v$version)."
            exit 1
          fi
          sha=$(git rev-parse --short=7 HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:$version"
            echo "$IMAGE:sha-$sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.amd64_only }}" != true ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      # The runtime stage of a linux/arm64 image runs (a pip install) under emulation.
      - uses: docker/setup-qemu-action@v3
        if: contains(steps.meta.outputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          # A single-platform build that is not pushed is loaded, for the smoke test below.
          # Plain manifests, no provenance index: older Docker engines pull them cleanly.
          provenance: false
          load: ${{ steps.meta.outputs.platforms == 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ARLESH_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

      # The image just built, with a seeded database and a port other than the default: the server
      # migrates the copied database, /health answers, a token minted with `docker exec` opens an
      # authenticated route. The seed is a database the same image created.
      - name: Smoke test · seeded database, token
        if: steps.meta.outputs.platforms == 'linux/amd64'
        env:
          ARLESH_IMAGE: ${{ env.IMAGE }}:latest
          ARLESH_PORT: '4760'
        run: |
          set -euo pipefail
          # A real arlesh.db made by the image itself (the baseline schema alone is not a database
          # the server accepts: the app records the applied migrations when it creates one), with a
          # token in it, then copied into the data folder as a user would copy theirs (with its -wal and -shm files, if any).
          mkdir seed data
          sudo chown 10001:10001 seed
          docker run --rm -v "$PWD/seed:/data" "$ARLESH_IMAGE" token add seeded
          sudo cp seed/arlesh.db* data/
          sudo chown -R 10001:10001 data
          docker run -d --name arlesh-server -p "$ARLESH_PORT:$ARLESH_PORT" \
            -e ARLESH_SERVER__PORT="$ARLESH_PORT" -v "$PWD/data:/data" "$ARLESH_IMAGE"
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$ARLESH_PORT/health" || true)
            if [ "$code" = 401 ]; then break; fi
            sleep 1
          done
          docker logs arlesh-server
          [ "$code" = 401 ] || { echo "::error::/health answered $code without a token (expected 401)"; exit 1; }
          docker exec arlesh-server arlesh-server token list | grep -q '^seeded'
          token=$(docker exec arlesh-server arlesh-server token add smoke | tail -1)
          curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:$ARLESH_PORT/health"; echo
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" "http://127.0.0.1:$ARLESH_PORT/board"
          for i in $(seq 1 12); do
            state=$(docker inspect -f '{{.State.Health.Status}}' arlesh-server)
            [ "$state" = healthy ] && break
            sleep 5
          done
          echo "container health: $state"
          [ "$state" = healthy ]
          docker rm -f arlesh-server
