[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arlesh-api"
version = "0.1.0"
description = "Arlesh's board over HTTP: a FastAPI service over the arlesh bindings"
requires-python = ">=3.11"
dependencies = ["arlesh", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
arlesh-api = "arlesh_api.cli:main"

[tool.uv.sources]
# The bindings, from this repository. CI and local builds install them with `maturin develop`
# (a debug build) before syncing the rest; see the README in this directory's CI job.
arlesh = { path = "../../crates/arlesh-py", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6", "maturin>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/arlesh_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["arlesh_api"]

[tool.mypy]
strict = true
packages = ["arlesh_api", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN401"]
