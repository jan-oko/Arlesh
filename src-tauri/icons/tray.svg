<!--
  Arlesh's TRAY mark. Deliberately not `icon.svg`, and deliberately simpler.

  `icon.svg` is the app logo: seven chevrons, each 18 units thick on a 344-unit box. A tray asks for
  roughly 22 to 24 logical pixels — 44 to 48 on this machine's 2x display — and at that size those
  bands are 1.2 to 2.5 pixels apart with 0.4 to 0.8 pixel gaps between them. They do not resolve:
  the whole mark greys over into a smear. That is what "fuzzy" was.

  So the tray gets its own mark, on the 24-unit grid every icon set uses: the same stack of
  chevrons, reduced to three, each 3.5 units thick with 3 units of clear air between them. At 48px
  that is a 7-pixel band and a 6-pixel gap; at 22px, 3.2 and 2.8. It stays the Arlesh pyramid and it
  survives being small, which the logo does not.

  Colour is not declared. `src-tauri/src/icon/svg.rs` reads only the outline and fills it flat
  white: a tray sits on a bar whose colour is not ours to know. Change the geometry here and the
  rendered bitmap follows at every size — this file is the source of truth for the shape.
-->
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <polygon points="12,2.5 17,3.75 17,7.25 12,6 7,7.25 7,3.75"/>
  <polygon points="12,9 20,11 20,14.5 12,12.5 4,14.5 4,11"/>
  <polygon points="12,15.5 23,18.25 23,21.75 12,19 1,21.75 1,18.25"/>
</svg>
