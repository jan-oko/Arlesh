[package]
name = "arlesh"
version = "0.3.0"
description = "Task management and knowledge-base desktop app"
authors = []
edition = "2021"

[lib]
name = "arlesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `main.rs` is six lines whose only statement is `arlesh_lib::run()`, but cargo still builds a test
# harness for it, and tarpaulin then traces that harness for ~25 seconds to run zero tests. Opting
# the binary out of `cargo test` skips it in both. The cost is that `cargo test` no longer
# type-checks `main.rs`; `cargo build` and the Tauri bundle still do.
[[bin]]
name = "arlesh"
path = "src/main.rs"
test = false

# `cargo-llvm-cov` sets these cfgs itself; declaring them here keeps the
# `unexpected_cfgs` lint quiet on every other build, where they are never set.
# The `coverage(off)` they gate is what keeps inline `#[cfg(test)] mod tests`
# bodies out of the coverage denominator — without it roughly half the measured
# lines are test code that is 100% covered by construction.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt"] }
png = "0.17"
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
axum = "0.8.9"
schemars = "1.2.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# `test` brings `tauri::test::mock_app`, the only way to obtain a real `tauri::State` — it is a
# newtype over a borrow with no public constructor, so without this a Tauri command cannot be
# called from a test at all. See `tests/helpers.rs::command_host`.
tauri = { version = "2", features = ["test"] }

# Debug builds statically link the whole dependency tree into every binary (the app plus one
# binary per integration-test file), and full DWARF debug info dominates the on-disk size. Keep
# just line tables — enough for readable panic/test backtraces — and strip the rest. This shrinks
# `target/debug` several-fold with no effect on behavior; step-debugging locals is the only cost.
[profile.dev]
debug = "line-tables-only"
strip = "debuginfo"

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
