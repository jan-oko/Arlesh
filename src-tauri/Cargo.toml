[package]
name = "arlesh"
version = "0.3.0"
description = "Task management and knowledge-base desktop app"
authors = []
edition = "2021"

[lib]
name = "arlesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `main.rs` is six lines whose only statement is `arlesh_lib::run()`, but cargo still builds a test
# harness for it, and tarpaulin then traces that harness for ~25 seconds to run zero tests. Opting
# the binary out of `cargo test` skips it in both. The cost is that `cargo test` no longer
# type-checks `main.rs`; `cargo build` and the Tauri bundle still do.
[[bin]]
name = "arlesh"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what puts Arlesh in the system tray, so closing the window can hide it there
# and leave the MCP endpoint answering. On Linux it needs libappindicator and libxdo at build
# time; CI installs them.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["net", "rt"] }
png = "0.17"
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
axum = "0.8.9"
schemars = "1.2.2"

# Linux's tray is the StatusNotifierItem D-Bus protocol, and `ksni` speaks it directly. Tauri's
# tray goes through libappindicator instead, whose item exports no `Activate` method at all — so a
# panel that wants to tell us about a left click has nothing to call, and `TrayIconEvent` can never
# fire. Owning the item is what makes a plain click reach the app. See `commands::tray`.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
# The same GTK bindings Tauri already links, named so the app can reach the header bar tao draws
# inside a window on Wayland, whose title does not follow the window's. See `commands::header_bar`.
gtk = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# `test` brings `tauri::test::mock_app`, the only way to obtain a real `tauri::State` — it is a
# newtype over a borrow with no public constructor, so without this a Tauri command cannot be
# called from a test at all. See `tests/helpers.rs::command_host`.
tauri = { version = "2", features = ["test"] }

# Debug builds statically link the whole dependency tree into every binary (the app plus one
# binary per integration-test file), and full DWARF debug info dominates the on-disk size. Keep
# just line tables — enough for readable panic/test backtraces — and strip the rest. This shrinks
# `target/debug` several-fold with no effect on behavior; step-debugging locals is the only cost.
[profile.dev]
debug = "line-tables-only"
strip = "debuginfo"

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
